name: CPU eval smoke

# Optional. A 0.6B pull is too slow and flaky for the required CI job.
# Run this by hand when you want a real CPU number from GitHub-hosted runners.
on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --extra dev
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Serve and pull qwen3:0.6b
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:11434/api/tags && break
            sleep 2
          done
          ollama pull qwen3:0.6b
      - name: Smoke eval
        run: uv run pocket-agent eval --suite smoke --backend ollama --model qwen3:0.6b --label "CPU smoke test" --out eval-cpu.json
      - uses: actions/upload-artifact@v4
        with:
          name: eval-cpu
          path: eval-cpu.json
